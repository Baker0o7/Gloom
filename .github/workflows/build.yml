name: Build APK

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', '.idea/*', 'LICENSE', 'FUNDING.yml']
  pull_request:
    branches: ['**']
    paths-ignore: ['**.md', '.idea/*', 'LICENSE', 'FUNDING.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :app:android:assembleDebug

      - name: Rename debug APK
        run: |
          VERSION="${GITHUB_REF_NAME:-debug}"
          cp app/android/build/outputs/apk/debug/gloom-debug.apk \
             "app/android/build/outputs/apk/debug/Gloom-${VERSION}-debug.apk"

      - name: Build release APK (if signing keys available)
        if: |
          (github.ref == 'refs/heads/main' ||
           startsWith(github.ref, 'refs/tags/v') ||
           github.event_name == 'workflow_dispatch') &&
          secrets.KEYSTORE_BASE64 != ''
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.jks
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks
          ./gradlew :app:android:packageRelease
          rm -f release.jks
          VERSION="${GITHUB_REF_NAME:-release}"
          cp app/android/build/outputs/apk/release/gloom-release.apk \
             "app/android/build/outputs/apk/release/Gloom-${VERSION}-release.apk"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gloom-debug
          path: app/android/build/outputs/apk/debug/Gloom-*-debug.apk
          if-no-files-found: warn

      - name: Upload release APK artifact
        if: |
          (github.ref == 'refs/heads/main' ||
           startsWith(github.ref, 'refs/tags/v') ||
           github.event_name == 'workflow_dispatch') &&
          secrets.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: Gloom-release
          path: app/android/build/outputs/apk/release/Gloom-*-release.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Gloom ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            app/android/build/outputs/apk/debug/Gloom-*-debug.apk
            app/android/build/outputs/apk/release/Gloom-*-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
