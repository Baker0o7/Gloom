name: Build APK

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', '.idea/*', 'LICENSE', 'FUNDING.yml']
  pull_request:
    branches: ['**']
    paths-ignore: ['**.md', '.idea/*', 'LICENSE', 'FUNDING.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :app:android:assembleDebug

      - name: Resolve release tag
        id: rel
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG=$(printf '%s' "$COMMIT_MSG" | grep -oE '\[release v[0-9]+\.[0-9]+\.[0-9]+\]' | head -1 | sed -E 's/\[release (.*)\]/\1/' || true)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Rename debug APK
        run: |
          VERSION="${{ steps.rel.outputs.tag }}"
          VERSION="${VERSION:-${GITHUB_REF_NAME:-debug}}"
          cp app/android/build/outputs/apk/debug/gloom-debug.apk \
             "app/android/build/outputs/apk/debug/Gloom-${VERSION}-debug.apk"

      - name: Build release APK (if signing keys available)
        if: |
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v') ||
          github.event_name == 'workflow_dispatch'
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.jks
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks
          ./gradlew :app:android:packageRelease
          rm -f release.jks
          VERSION="${GITHUB_REF_NAME:-release}"
          cp app/android/build/outputs/apk/release/gloom-release.apk \
             "app/android/build/outputs/apk/release/Gloom-${VERSION}-release.apk"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gloom-debug
          path: app/android/build/outputs/apk/debug/Gloom-*-debug.apk
          if-no-files-found: warn

      - name: Upload release APK artifact
        if: |
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v') ||
          github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Gloom-release
          path: app/android/build/outputs/apk/release/Gloom-*-release.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          name: "Gloom ${{ steps.rel.outputs.tag }}"
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            app/android/build/outputs/apk/debug/Gloom-*-debug.apk
            app/android/build/outputs/apk/release/Gloom-*-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
